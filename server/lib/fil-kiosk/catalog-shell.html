<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Etili Seramik — Ürünleri keşfedin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f4f0;color:#212322;font:18px/1.55 system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select{min-height:52px}button{border:1px solid #ccc7bc;background:#fff;color:inherit;border-radius:10px;padding:12px 20px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #b57800;outline-offset:3px}header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:4px solid #eba900;padding:18px 4vw;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header img{width:180px;max-height:75px;object-fit:contain}header nav{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}header a{display:inline-flex;align-items:center;background:#212322;color:white;border-radius:10px;padding:10px 18px;text-decoration:none}main{max-width:1500px;margin:auto;padding:30px 4vw 80px}h1{font-size:clamp(28px,4vw,52px);line-height:1.15;margin:20px 0}h2{font-size:26px}p{max-width:850px}.eyebrow{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#785300}.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.crumb button{background:transparent;border:0;padding:8px;font-size:16px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.controls input{flex:1;min-width:210px}.controls input,.controls select{border:1px solid #b8b2a7;border-radius:8px;padding:10px;background:white;max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:22px}.card{text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;background:white}.card img{width:100%;height:225px;object-fit:contain;background:#ece9e2}.card span{padding:16px;font-weight:650;line-height:1.4}.card small{display:block;font-size:14px;font-weight:400;margin-top:5px}.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px}.hero{width:100%;height:min(60vh,670px);object-fit:contain;background:white;border-radius:14px}.thumbs{display:flex;gap:12px;overflow:auto;margin:14px 0}.thumbs img{width:90px;height:80px;object-fit:contain}.specs{display:grid;grid-template-columns:1fr 1.2fr;margin:20px 0;border-top:1px solid #ccc7bc}.specs dt,.specs dd{margin:0;padding:12px 6px;border-bottom:1px solid #ccc7bc;overflow-wrap:anywhere}.specs dt{font-weight:650}.qr{display:flex;align-items:center;gap:18px;background:#fff;padding:18px;border-radius:12px;margin:22px 0}.qr img{width:150px;height:150px}.qr p{font-size:16px}.groups{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.groups button[aria-pressed=true]{background:#212322;color:white;border-color:#212322}.pager{display:flex;align-items:center;justify-content:center;gap:15px;margin:30px 0}.empty{padding:40px;background:white;border-radius:14px}.muted{color:#605e57;font-size:16px}footer{padding:20px 4vw;color:#605e57;font-size:14px}.source{font-size:13px;overflow-wrap:anywhere}@media(max-width:700px){body{font-size:17px}.detail{grid-template-columns:1fr;gap:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card img{height:170px}.card span{padding:12px;font-size:16px}header img{width:140px}header nav{margin-left:0}.qr img{width:110px;height:110px}.specs{font-size:15px}.hero{height:45vh}}
</style></head><body><header><img id="logo" alt="Etili Seramik"><nav aria-label="Ana gezinme"><button id="back">Geri</button><button id="home">Ana sayfa</button><a href="https://fil-kiosk.invalid/return">Tanıtımı izle</a></nav></header><main id="main"></main><footer>Etili Seramik — Sunum demosu · FILSign<br>Ürün bilgileri herkese açık kaynak siteden alınmıştır. Fiyat ve stok bilgisi içermez.</footer><script>
'use strict';const DATA=/*FIL_DATA*/null;const {menu,assets}=DATA;const items=menu.items.filter(x=>x.active!==false);const byId=new Map(items.map(x=>[x.id,x]));const main=document.getElementById('main');let current=null,group='',query='',page=0,filters={};const fold=s=>String(s||'').normalize('NFC').toLocaleLowerCase('tr-TR');const collator=new Intl.Collator('tr-TR',{numeric:true,sensitivity:'base'});
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function button(text,fn){const b=el('button',text);b.type='button';b.onclick=fn;return b}function media(id){return assets[id]?.data||''}function image(id,alt){const im=el('img');im.alt=alt;im.src=media(id);im.loading='lazy';im.onerror=()=>{im.replaceWith(el('p','Görsel yüklenemedi.','muted'))};return im}const logo=document.getElementById('logo');if(menu.logoMediaId)logo.src=media(menu.logoMediaId);else logo.replaceWith(el('strong','Etili Seramik'));
function ancestors(item){const a=[];while(item){a.unshift(item);item=byId.get(item.parent)}return a}function inGroup(i){return !group||(i.groups||[]).includes(group)||items.some(x=>x.parent===i.id&&inGroup(x))}function go(id,reset=true){current=id;page=0;if(reset){query='';filters={}}render();window.scrollTo(0,0)}document.getElementById('home').onclick=()=>{group='';go(null)};document.getElementById('back').onclick=()=>go(byId.get(current)?.parent||null);
function render(){main.replaceChildren();const item=byId.get(current);const crumb=el('nav',undefined,'crumb');crumb.setAttribute('aria-label','Kategori yolu');crumb.append(button('Ürünler',()=>go(null)));for(const a of ancestors(item)){crumb.append(el('span','›'),button(a.label,()=>go(a.id)))}main.append(crumb);document.getElementById('back').disabled=!current;
 if(!item){main.append(el('p','ETİLİ SERAMİK','eyebrow'),el('h1','Yaşam alanınız için keşfedin'),el('p','Ürün grubunu ve seriyi seçin; yüzeyleri, ebatları ve kaynakta yayımlanan teknik özellikleri inceleyin.'));const groups=el('div',undefined,'groups');for(const g of ['',...new Set(items.flatMap(x=>x.groups||[]))]){const b=button(g||'Tüm ürün grupları',()=>{group=g;page=0;render()});b.setAttribute('aria-pressed',String(group===g));groups.append(b)}main.append(groups)}else main.append(el('h1',item.label));
 if(item&&item.type!=='category'){detail(item);return}let list=items.filter(x=>(x.parent||null)===(current||null)&&inGroup(x));const all=list;const controls=el('div',undefined,'controls');const input=el('input');input.type='search';input.placeholder=current?'Bu listede ara':'Seri ara';input.setAttribute('aria-label',input.placeholder);input.value=query;input.oninput=()=>{query=input.value;page=0;paintList()};controls.append(input);if(list.some(x=>x.specifications))for(const key of ['Ebat','Yüzey Bitişi','Renk','Doku']){const vals=[...new Set(list.flatMap(x=>(x.specifications?.[key]||'').split(', ').filter(Boolean)))].sort(collator.compare);if(vals.length<2)continue;const s=el('select');s.setAttribute('aria-label',key);const o=el('option',key+' — Tümü');o.value='';s.append(o);for(const v of vals){const o=el('option',v);o.value=v;s.append(o)}s.value=filters[key]||'';s.onchange=()=>{filters[key]=s.value;page=0;paintList()};controls.append(s)}main.append(controls);const output=el('section');output.setAttribute('aria-live','polite');main.append(output);
 function paintList(){output.replaceChildren();list=all.filter(x=>fold(x.label+' '+(x.description||'')).includes(fold(query))&&Object.entries(filters).every(([k,v])=>!v||(x.specifications?.[k]||'').split(', ').includes(v))).sort((a,b)=>(a.order-b.order)||collator.compare(a.label,b.label));output.append(el('p',new Intl.NumberFormat('tr-TR').format(list.length)+' sonuç','muted'));if(!list.length){output.append(el('p','Bu arama için sonuç bulunamadı. Filtreleri değiştirerek yeniden deneyin.','empty'));return}const grid=el('div',undefined,'grid');for(const c of list.slice(page*24,(page+1)*24)){const b=button('',()=>go(c.id));b.className='card';const cover=c.media?.[0]||items.find(x=>x.parent===c.id&&x.media?.length)?.media[0];if(cover)b.append(image(cover,c.label));const text=el('span',c.label);if(c.type==='category')text.append(el('small','İncele →'));b.append(text);grid.append(b)}output.append(grid);const pages=Math.ceil(list.length/24);if(pages>1){const p=el('nav',undefined,'pager');p.setAttribute('aria-label','Sayfalama');const prev=button('Önceki',()=>{page--;paintList()});prev.disabled=!page;const next=button('Sonraki',()=>{page++;paintList()});next.disabled=page===pages-1;p.append(prev,el('span',(page+1)+' / '+pages),next);output.append(p)}}paintList();}
 function detail(item){const wrap=el('section',undefined,'detail'),gallery=el('div'),body=el('div');const photos=[...(item.media||[]),...(byId.get(item.seriesId)?.media||[])];if(photos.length){const hero=image(photos[0],item.label+' — Ürün yüzeyi');hero.className='hero';const caption=el('p','Ürün yüzeyi','muted');gallery.append(hero,caption);const thumbs=el('div',undefined,'thumbs');for(const id of photos){const label=(item.media||[]).includes(id)?'Ürün yüzeyi: '+item.label:'Seri mekân görseli — ürün seçeneğiyle birebir eşleştiği doğrulanmamıştır.';const b=button('',()=>{hero.src=media(id);hero.alt=label;caption.textContent=label});b.setAttribute('aria-label','Görseli büyüt: '+label);b.append(image(id,label));thumbs.append(b)}gallery.append(thumbs)}else gallery.append(el('p','Kaynakta ürün görseli bulunamadı.','empty'));if(item.description)body.append(el('p',item.description));else body.append(el('p','Kaynakta ürün açıklaması yayımlanmamış. Teknik bilgiler aşağıda yer alıyor.','muted'));if(item.sourceCode)body.append(el('p','Ürün kodu: '+item.sourceCode));const specs=el('dl',undefined,'specs');for(const [k,v]of Object.entries(item.specifications||{}))specs.append(el('dt',k),el('dd',v));body.append(specs);if(item.qr){const q=el('div',undefined,'qr'),im=el('img');im.src=item.qr;im.alt='Orijinal ürün sayfasının QR kodu';q.append(im,el('p','Orijinal ürün sayfası için telefonunuzla tarayın. Telefonda internet bağlantısı gerekir. Bu katalog çevrimdışı gezilebilir.'));body.append(q)}if(item.sourceUrl)body.append(el('p',item.sourceUrl,'source'));if(item.parent)body.append(button('Aynı serideki diğer seçenekler',()=>go(item.seriesId||item.parent)));wrap.append(gallery,body);main.append(wrap)}render();
</script></body></html>
