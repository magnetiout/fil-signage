<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FILSign</title>
<style>*{box-sizing:border-box}body{margin:0;font:20px system-ui,sans-serif;background:var(--bg,#102230);color:var(--text,#fff)}header,main,footer{padding:24px;max-width:1300px;margin:auto}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0;flex:1;font-size:clamp(24px,4vw,48px)}button,a{font:inherit;min-height:56px;padding:14px 22px;border:0;border-radius:14px;cursor:pointer;background:var(--primary,#237c94);color:white;text-decoration:none}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.tile{text-align:left;min-height:140px;overflow-wrap:anywhere}.tile small{display:block;margin-top:12px;opacity:.8}img,video{max-width:100%;max-height:70vh;object-fit:contain;border-radius:16px}#detail{white-space:pre-wrap;line-height:1.6}#gallery{display:flex;gap:16px;flex-wrap:wrap}#gallery img{max-width:min(100%,520px)}footer{opacity:.65;font-size:16px}iframe{width:100%;height:65vh;border:0;background:white}button:focus-visible,a:focus-visible{outline:4px solid white;outline-offset:4px}</style>
<header><button id="home">Ana sayfa</button><button id="back">Geri</button><h1 id="title"></h1><a id="return" href="https://fil-kiosk.invalid/return">Yayına dön</a></header><main><div id="grid"></div><div id="detail"></div><div id="gallery"></div></main><footer>FILSign · Dokunarak keşfedin</footer>
<script>
'use strict';
const {menu,assets}=/*FIL_DATA*/null;
const root=document.documentElement;for(const [key,name]of [['background','bg'],['primary','primary'],['text','text']])if(menu.theme?.[key])root.style.setProperty('--'+name,menu.theme[key]);
const grid=document.getElementById('grid'),detail=document.getElementById('detail'),gallery=document.getElementById('gallery'),title=document.getElementById('title');let history=[];
window.filVideoPlaying=false;
function stop(){document.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});window.filVideoPlaying=false;grid.replaceChildren();detail.replaceChildren();gallery.replaceChildren();}
function show(id,push=true){if(push)history.push(id);stop();const item=menu.items.find(x=>x.id===id);title.textContent=item?.label||menu.title;
 if(!item||item.type==='category'){menu.items.filter(x=>(x.parent||null)===(id||null)&&x.active!==false).sort((a,b)=>a.order-b.order).forEach(x=>{const b=document.createElement('button');b.className='tile';b.textContent=(x.icon||'')+' '+x.label;const s=document.createElement('small');s.textContent=x.description||'';b.append(s);b.onclick=()=>show(x.id);grid.append(b)});}
 else{detail.textContent=item.description||'';for(const mid of item.media||[]){const asset=assets[mid];if(!asset)continue;const el=document.createElement(asset.mime.startsWith('video/')?'video':'img');el.src=asset.data;el.alt=item.label;if(el.tagName==='VIDEO'){el.controls=true;el.playsInline=true;el.loop=false;el.onplay=()=>{document.querySelectorAll('video').forEach(v=>{if(v!==el)v.pause()});window.filVideoPlaying=true};for(const ev of ['pause','ended','error'])el.addEventListener(ev,()=>{window.filVideoPlaying=Array.from(document.querySelectorAll('video')).some(v=>!v.paused&&!v.ended)})}gallery.append(el)}
 if(item.type==='url'){const note=document.createElement('p');note.textContent='Bu web içeriği internet bağlantısı gerektirir; çevrimdışı kullanılamaz.';detail.append(note);const b=document.createElement('button');b.textContent='Web içeriğini aç';b.onclick=()=>{const frame=document.createElement('iframe');frame.sandbox='allow-scripts allow-forms';frame.referrerPolicy='no-referrer';frame.src=item.url;gallery.replaceChildren(frame)};detail.append(b)}}
 document.getElementById('back').hidden=history.length<2;}
document.getElementById('home').onclick=()=>{history=[];show(null)};document.getElementById('back').onclick=()=>{history.pop();show(history.pop()||null)};show(null);
</script></html>
