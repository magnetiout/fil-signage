name: FIL Signage
on:
  push:
    branches: ['fil/**']
    paths: ['server/**', 'frontend/**', 'android/**', 'shared/**', 'scripts/**', '.github/workflows/fil-ci.yml']
  pull_request:
    paths: ['server/**', 'frontend/**', 'android/**', 'shared/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fil-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-fund
      - run: npm run check:admin
      - run: npm test
      - run: npm audit --omit=dev
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest
        working-directory: android
      - run: node scripts/android-license-check.js
